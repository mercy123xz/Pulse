name: Build Windows app

on:
  push:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Replace the installer of the current version's release with this build (same version number)"
        type: boolean
        default: false
  # Publishing a release on GitHub builds the installer and attaches it to that release.
  release:
    types: [published]

permissions:
  contents: write
  # For the build provenance below.
  id-token: write
  attestations: write

jobs:
  windows:
    # Android preview releases are made by android.yml; they get no Windows installer.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'android')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # Makes sure the .exe runs on a fresh PC: it must not need the
      # Visual C++ Redistributable (vcruntime140.dll / msvcp140.dll).
      - name: Check pulse.exe needs nothing extra
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\pulse.exe | Out-String
          Write-Output $deps
          if ($deps -match '(?i)vcruntime|msvcp') { throw "pulse.exe still needs the Visual C++ runtime" }

      # The .exe must carry Pulse's icon (added by build.rs).
      - name: Check pulse.exe has its icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\target\release\pulse.exe")
          $default = [System.Drawing.SystemIcons]::Application
          if ($icon.ToBitmap().GetPixel(16, 16) -eq $default.ToBitmap().GetPixel(16, 16)) { Write-Warning "pulse.exe may be missing its icon" }

      # Installer (PulseSetup-x.y.z.exe) made with Inno Setup.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=$version" installer\pulse.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-ChildItem target\installer

      # Signs the installer with Pulse's release key, so Pulse can check an update
      # before running it. The key is the PULSE_SIGNING_KEY secret (an Ed25519 key in
      # PEM form); the public half is installer/update-key.pub.pem and is built into Pulse.
      - name: Sign installer
        shell: bash
        env:
          PULSE_SIGNING_KEY: ${{ secrets.PULSE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          setup=$(ls target/installer/PulseSetup-*.exe | head -1)
          if [ -z "${PULSE_SIGNING_KEY:-}" ]; then
            echo "::warning::PULSE_SIGNING_KEY isn't set: this installer is unsigned, so Pulse won't install it by itself."
            exit 0
          fi
          # OpenSSL 3 signs Ed25519 over the whole file (-rawin). Git for Windows has it.
          openssl=""
          for o in /mingw64/bin/openssl /usr/bin/openssl openssl; do
            if "$o" version 2>/dev/null | grep -q '^OpenSSL 3'; then openssl="$o"; break; fi
          done
          [ -n "$openssl" ] || { echo "::error::OpenSSL 3 not found"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/pulse-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PULSE_SIGNING_KEY" | tr -d '\r' > "$key"
          "$openssl" pkeyutl -sign -inkey "$key" -rawin -in "$setup" -out "$RUNNER_TEMP/setup.sig"
          # The signature must check out with the key Pulse has, or nothing is published.
          "$openssl" pkeyutl -verify -pubin -inkey installer/update-key.pub.pem -rawin -in "$setup" -sigfile "$RUNNER_TEMP/setup.sig"
          base64 -w0 "$RUNNER_TEMP/setup.sig" > target/installer/signature.b64

      # Proof, signed by GitHub, that these exact files were built here from this commit
      # of the public source. Anyone can check a download with:
      #   gh attestation verify PulseSetup-X.Y.Z.exe -R mercy123xz/Pulse
      - name: Record build provenance
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/pulse.exe
            target/installer/PulseSetup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-windows
          path: |
            target/release/pulse.exe
            target/installer/PulseSetup-*.exe

      # When main is built and the version in Cargo.toml (e.g. 0.1.0) has no release yet,
      # publish one (tag v0.1.0) with the installer attached. To ship a new version later,
      # bump `version` in Cargo.toml and push.
      - name: Publish a release for a new version
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists, nothing to publish."; exit 0 }
          $setup = Get-ChildItem target/installer/PulseSetup-*.exe | Select-Object -First 1
          # The signature goes in the notes as a comment: hidden on the page, read by Pulse.
          $notes = Get-Content .github/release-notes.md -Raw
          if (Test-Path target/installer/signature.b64) {
            $sig = (Get-Content target/installer/signature.b64 -Raw).Trim()
            $notes = $notes.TrimEnd() + "`n`n<!-- pulse-signature ed25519:$sig -->`n"
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Value $notes -NoNewline -Encoding utf8
          gh release create $tag $setup.FullName --target $env:GITHUB_SHA --title "Pulse $tag" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "published=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0

      # A new version is out: tell the Discord server (#announcements, @everyone) and X.
      - name: Announce the release
        if: steps.publish.outputs.published == 'true'
        shell: pwsh
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
        run: python .github/scripts/announce.py "${{ steps.publish.outputs.version }}" "${{ steps.publish.outputs.tag }}"

      # A new version: ask winget to list it too (a pull request to microsoft/winget-pkgs
      # from your account). Needs the WINGET_TOKEN secret; skipped without it. It only
      # works once Pulse is in winget, and a failure here never stops the release.
      - name: Update winget
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "No WINGET_TOKEN secret: not updating winget."; exit 0 }
          $v = "${{ steps.publish.outputs.version }}"
          $url = "https://github.com/mercy123xz/Pulse/releases/download/v$v/PulseSetup-$v.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update mercy123xz.Pulse --version $v --urls $url --submit --token $env:WINGET_TOKEN

      # Run by hand with "refresh": the release for the version in Cargo.toml gets this
      # build's installer instead (and its signature), without a new version number.
      - name: Replace the current version's installer
        if: github.event_name == 'workflow_dispatch' && inputs.refresh && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          $setup = Get-ChildItem target/installer/PulseSetup-*.exe | Select-Object -First 1
          if (-not (Test-Path target/installer/signature.b64)) { throw "The installer isn't signed: not replacing the release's." }
          gh release upload $tag $setup.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
          $sig = (Get-Content target/installer/signature.b64 -Raw).Trim()
          $body = Get-Content .github/release-notes.md -Raw
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Value ($body.TrimEnd() + "`n`n<!-- pulse-signature ed25519:$sig -->`n") -NoNewline -Encoding utf8
          gh release edit $tag --notes-file $notesFile
          exit $LASTEXITCODE

      # A release made by hand on GitHub also gets the installer attached.
      - name: Attach the installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $setup = Get-ChildItem target/installer/PulseSetup-*.exe | Select-Object -First 1
          gh release upload $tag $setup.FullName --clobber
          if (Test-Path target/installer/signature.b64) {
            $sig = (Get-Content target/installer/signature.b64 -Raw).Trim()
            $body = (gh release view $tag --json body -q .body | Out-String)
            $body = [regex]::Replace($body, '(?s)\s*<!-- pulse-signature ed25519:.*?-->', '').TrimEnd()
            $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
            Set-Content -Path $notesFile -Value ($body + "`n`n<!-- pulse-signature ed25519:$sig -->`n") -NoNewline -Encoding utf8
            gh release edit $tag --notes-file $notesFile
          }
