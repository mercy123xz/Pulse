name: Build Android app

# Builds the Android app (android/) into an APK and puts it on the "Pulse for Android
# (preview)" release, a pre-release, so the desktop app's update check never sees it.

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      # The same signing key every build, so a new preview installs over the old one: your
      # own key from secrets if you've added one, otherwise a debug key kept in the cache.
      - name: Signing key (from secrets, if set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > android/release.keystore

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pulse-android-debug-keystore

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace --no-daemon

      # Each build gets its own file name (version and build number), so a phone never
      # opens an older download by mistake.
      - name: Name it
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          name="Pulse-android-${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-android-preview
          path: ${{ env.APK }}

      - name: Put it on the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Preview builds of Pulse for Android, made from the ${GITHUB_REF_NAME} branch. Version ${VERSION}, build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}.

          To install: open this page on your phone, download ${APK} (the only APK here: older builds are removed), open it, and allow installing from your browser when Android asks. A newer preview installs over an older one.

          Already downloaded an older one? Delete it from your Downloads first, so you don't open it by mistake. In Pulse, Settings shows the version at the bottom."
          if gh release view android-preview >/dev/null 2>&1; then
            gh release edit android-preview --notes "$notes"
          else
            gh release create android-preview --prerelease --target "$GITHUB_SHA" --title "Pulse for Android (preview)" --notes "$notes"
          fi
          gh release upload android-preview "$APK" --clobber
          # Only the newest build stays.
          gh release view android-preview --json assets -q '.assets[].name' | grep '\.apk$' | grep -vxF "$APK" | while read -r old; do
            gh release delete-asset android-preview "$old" -y
          done
