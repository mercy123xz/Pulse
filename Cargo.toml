[package]
name = "pulse"
version = "1.0.0"
edition = "2024"
description = "A fast, native music player written in Rust: any song, with info from Deezer and audio from YouTube"

[dependencies]
# Window + UI
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
# Loads album art straight from URLs (ui.image("https://..."))
egui_extras = { version = "0.36", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
# Already used by egui for fonts: reads icon outlines so they can be centered exactly.
skrifa = "0.44"

# Audio playback (MP3 decoding via symphonia)
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "wav", "vorbis", "symphonia-alac"] }

# HTTP + JSON
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
lofty = "0.22"
toml = "0.9"
notify = "8"
miniz_oxide = "0.8"
base64 = "0.22"
# Checks the signature on updates (already used for secure connections).
ring = { version = "0.17", default-features = false }

# On Windows, draw with DirectX 12 (through wgpu) instead of OpenGL. DirectX 12 is built
# into every Windows 10/11 PC, and it falls back to software drawing when a PC has no
# proper graphics driver, so Pulse opens everywhere with nothing extra to install.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
rfd = "0.18.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Make debug builds play audio smoothly (decoding is slow without optimizations)
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
